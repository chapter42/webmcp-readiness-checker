name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# A new push to a PR makes the in-flight run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Dependency-free and fast: if this fails, nothing else is worth running.
  verify:
    name: Syntax & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Parse every shipped script
        run: npm run syntax

      - name: Run the test suite
        run: npm test

  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dev dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

  package:
    name: Build store zip
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Read manifest version
        id: manifest
        run: echo "version=$(node -p "require('./extension/manifest.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build the package
        run: npm run package

      # Lets a reviewer download the exact artifact a PR would ship and load it
      # unpacked, which since Chrome 150 is the only way to test an unpacked
      # build (the --load-extension flag was removed).
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: webmcp-readiness-checker-${{ steps.manifest.outputs.version }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 30
